<text x="685" y="323" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">1 lookup</text>
<path d="M740,305 A85.0,10 0 0 1 910,305 V375 A85.0,10 0 0 1 740,375 Z" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<ellipse cx="825.0" cy="305" rx="85.0" ry="10" fill="#BBDEFB" stroke="#1E88E5" stroke-width="2"/>
<text x="825.0" y="341.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">Redis</text>
<text x="825.0" y="359.75" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle">cache-aside · TTL 1 h</text>
<polyline points="615,290 615,240 825,240 825,196" fill="none" stroke="#455A64" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="720" y="234" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">2 on cache miss: read DB, fill cache</text>
<rect x="420" y="465" width="490" height="110" rx="12" fill="#FFF8EE" stroke="#FFB74D" stroke-width="1.4"/>
<text x="665.0" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#BF5B00" text-anchor="middle">Kafka (Strimzi)</text>
<rect x="440" y="500" width="450" height="34" rx="17.0" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2.6"/>
<text x="665.0" y="521.0" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle">links.click.events</text>
<text x="665" y="558" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle">key = code · batched + compressed · 6 partitions</text>
<polyline points="525,390 525,499" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535" y="445" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="start" stroke="white" stroke-width="4" paint-order="stroke">3 send async (never waits)</text>
<polyline points="910,517 990,517" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="950" y="510" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">consume</text>
<rect x="990" y="470" width="210" height="100" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="1095.0" y="501.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">analytics-service</text>
<text x="1095.0" y="520.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#2E7D32" text-anchor="middle">Spring Boot · batch @KafkaListener</text>
<text x="1095.0" y="536.25" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle">counts per link / minute</text>
<text x="1095.0" y="551.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle">GET /links/{code}/stats</text>
<polyline points="1095,570 1095,600" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1020,610 A75.0,10 0 0 1 1170,610 V670 A75.0,10 0 0 1 1020,670 Z" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<ellipse cx="1095.0" cy="610" rx="75.0" ry="10" fill="#BBDEFB" stroke="#1E88E5" stroke-width="2"/>
<text x="1095.0" y="641.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">PostgreSQL</text>
<text x="1095.0" y="659.75" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle">stats schema (same server)</text>
<polyline points="270,390 270,712 1240,712 1240,520 1201,520" fill="none" stroke="#455A64" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="700" y="706" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">GET /links/{code}/stats</text>
<rect x="1290" y="95" width="190" height="380" rx="12" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.4"/>
<text x="1385" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">Remember</text>
<text x="1385" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#212121" text-anchor="middle">Redirect now,</text>
<text x="1385" y="189" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#212121" text-anchor="middle">count later.</text>
<text x="1385" y="237" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#212121" text-anchor="middle">Cache what&#x27;s read,</text>
<text x="1385" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#212121" text-anchor="middle">stream what&#x27;s written.</text>
<text x="1385" y="309" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#616161" text-anchor="middle">Kafka down?</text>
<text x="1385" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#616161" text-anchor="middle">Redirects still work.</text>
<text x="1385" y="381" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#616161" text-anchor="middle">One service until</text>
<text x="1385" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#616161" text-anchor="middle">you need two.</text>
