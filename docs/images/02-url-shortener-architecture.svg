<text x="610" y="143" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">save new link</text>
<path d="M740,115 A85.0,10 0 0 1 910,115 V185 A85.0,10 0 0 1 740,185 Z" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
