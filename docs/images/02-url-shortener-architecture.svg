<text x="80.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#616161" text-anchor="middle">browser / API</text>
<polyline points="140,335 200,335" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200" y="280" width="140" height="110" rx="10" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/>
<text x="270.0" y="316.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">Ingress</text>
<text x="270.0" y="335.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#616161" text-anchor="middle">/links → shortener</text>
<text x="270.0" y="350.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#616161" text-anchor="middle">/{code} → shortener</text>
<text x="270.0" y="365.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#616161" text-anchor="middle">/stats → analytics</text>
<polyline points="340,340 420,340" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420" y="290" width="210" height="100" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="525.0" y="321.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">shortener-service</text>
<text x="525.0" y="340.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#2E7D32" text-anchor="middle">Spring Boot · HPA 2–10 pods</text>
<text x="525.0" y="356.25" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle">POST /links · GET /{code} → 302</text>
<text x="525.0" y="371.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle">fires click event (async)</text>
