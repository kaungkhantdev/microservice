<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790">
<title>Project 2 - URL Shortener architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#455A64"/></marker><marker id="mk-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00" stroke="#EF6C00" stroke-width="1.2"/></marker><marker id="mk-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C62828" stroke="#C62828" stroke-width="1.2"/></marker><marker id="mk-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="#78909C" stroke="#78909C" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121" text-anchor="start">Project 2 · URL Shortener</text>
<text x="30" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">One stateless service for create + redirect (cache first) · clicks counted later through Kafka</text>
<rect x="170" y="75" width="1095" height="650" rx="16" fill="none" stroke="#326CE5" stroke-width="2" stroke-dasharray="7 5"/>
<text x="186" y="97" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#326CE5" text-anchor="start">Kubernetes cluster (kind)</text>
<text x="186" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#616161" text-anchor="start">namespace: shortener</text>
<rect x="400" y="262" width="530" height="145" rx="14" fill="#F1F8E9" stroke="none" stroke-width="0"/>
<text x="412" y="279" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2E7D32" text-anchor="start">HOT PATH · sync · p95 &lt; 20 ms</text>
<rect x="400" y="435" width="840" height="265" rx="14" fill="#FFF8EE" stroke="none" stroke-width="0"/>
<text x="415" y="688" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="start">ANALYTICS · async · counted seconds later</text>
