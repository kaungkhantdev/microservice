<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1058" viewBox="0 0 1340 1058">
<title>Project 4 · Flow: place an order</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#455A64"/></marker><marker id="mk-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00" stroke="#EF6C00" stroke-width="1.2"/></marker><marker id="mk-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C62828" stroke="#C62828" stroke-width="1.2"/></marker><marker id="mk-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="#78909C" stroke="#78909C" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="20" y="669" width="1300" height="290" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121" text-anchor="start">Project 4 · Flow: place an order</text>
<text x="30" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">Each service saves data + event in one DB transaction (outbox) · Debezium ships events to Kafka</text>
<polyline points="120,132 120,968" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="30.0" y="80" width="180" height="52" rx="10" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="7 5"/>
<text x="120" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">Customer</text>
<polyline points="350,132 350,968" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="260.0" y="80" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="350" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">order-service</text>
<polyline points="580,132 580,968" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="490.0" y="80" width="180" height="52" rx="10" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/>
<text x="580" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">Kafka</text>
<text x="580" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle">via outbox + Debezium</text>
<polyline points="810,132 810,968" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="720.0" y="80" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="810" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">payment-service</text>
<polyline points="1040,132 1040,968" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="950.0" y="80" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="1040" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">inventory-service</text>
<line x1="120" y1="189" x2="347" y2="189" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="235.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">1. POST /orders (Idempotency-Key)</text>
<rect x="358" y="210" width="312.40000000000003" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="367" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">2. one tx: order PENDING + outbox OrderCreated</text>
<line x1="350" y1="261" x2="123" y2="261" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="235.0" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">202 {orderId}</text>
<line x1="350" y1="297" x2="577" y2="297" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="465.0" y="291" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">3. OrderCreated</text>
<line x1="580" y1="333" x2="807" y2="333" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="695.0" y="327" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">4. OrderCreated</text>
<rect x="818" y="354" width="267.6" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="827" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">5. authorize · one tx: payment + outbox</text>
<line x1="810" y1="405" x2="583" y2="405" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="695.0" y="399" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">6. PaymentAuthorized</text>
<line x1="580" y1="441" x2="1037" y2="441" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="810.0" y="435" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">7. PaymentAuthorized</text>
<rect x="1048" y="462" width="280.40000000000003" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="1057" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">8. reserve stock · one tx: stock + outbox</text>
<line x1="1040" y1="513" x2="583" y2="513" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="810.0" y="507" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">9. StockReserved</text>
<line x1="580" y1="549" x2="353" y2="549" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="465.0" y="543" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">10. StockReserved</text>
<rect x="358" y="570" width="158.8" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="367" y="586" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">11. status = COMPLETED</text>
<line x1="120" y1="621" x2="347" y2="621" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="235.0" y="615" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">12. GET /orders/{id}</text>
<line x1="350" y1="657" x2="123" y2="657" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="235.0" y="651" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">COMPLETED + timeline</text>
<text x="34" y="690" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828" text-anchor="start">IF stock is unavailable → compensate (undo the payment)</text>
<rect x="1048" y="712" width="254.8" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="1057" y="728" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">8. no stock → outbox StockUnavailable</text>
<line x1="1040" y1="763" x2="583" y2="763" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="810.0" y="757" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">9. StockUnavailable</text>
<line x1="580" y1="799" x2="807" y2="799" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="695.0" y="793" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">10. StockUnavailable</text>
<rect x="818" y="820" width="242.0" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="827" y="836" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">11. refund → outbox PaymentRefunded</text>
<line x1="810" y1="871" x2="583" y2="871" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="695.0" y="865" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">12. PaymentRefunded</text>
<line x1="580" y1="907" x2="353" y2="907" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="465.0" y="901" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">13. PaymentRefunded</text>
<rect x="358" y="928" width="158.8" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="367" y="944" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">14. status = CANCELLED</text>
<text x="30" y="993" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">Every consumer first checks its processed_events table, so a duplicate event changes nothing.</text>
<line x1="30" y1="1026" x2="62" y2="1026" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="72" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">call (waits)</text>
<line x1="181" y1="1026" x2="213" y2="1026" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="223" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">reply</text>
<line x1="286" y1="1026" x2="318" y2="1026" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="328" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">Kafka event (async)</text>
<line x1="483" y1="1026" x2="515" y2="1026" stroke="#C62828" stroke-width="1.8" marker-end="url(#mk-red)"/>
<text x="525" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">failure</text>
<rect x="601" y="1017" width="34" height="18" rx="4" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="643" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">inside the service</text>
</svg>
