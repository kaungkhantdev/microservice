<line x1="330" y1="409" x2="537" y2="409" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="403" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">4. GET abc123</text>
<line x1="540" y1="445" x2="333" y2="445" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="435.0" y="439" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">hit: url</text>
<line x1="330" y1="481" x2="123" y2="481" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="225.0" y="475" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">5. 302 Location: url</text>
<line x1="330" y1="517" x2="957" y2="517" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="645.0" y="511" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">6. LinkClicked (async, never waits)</text>
<line x1="960" y1="553" x2="1167" y2="553" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="1065.0" y="547" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">7. batch of clicks</text>
<rect x="1178" y="574" width="203.60000000000002" height="24" rx="5" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="1187" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="start">8. clicks += n (stats schema)</text>
<text x="34" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#F9A825" text-anchor="start">IF the code is not in the cache (miss)</text>
<line x1="540" y1="667" x2="333" y2="667" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="435.0" y="661" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">miss</text>
<line x1="330" y1="703" x2="747" y2="703" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="697" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">read abc123</text>
<line x1="750" y1="739" x2="333" y2="739" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="540.0" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">url</text>
<line x1="330" y1="775" x2="537" y2="775" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="769" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">SET abc123 (TTL 1 h)</text>
<text x="34" y="816" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#546E7A" text-anchor="start">C · See the stats</text>
<line x1="120" y1="853" x2="1167" y2="853" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="645.0" y="847" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">9. GET /links/abc123/stats</text>
<line x1="1170" y1="889" x2="123" y2="889" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="645.0" y="883" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">200 {clicks: 1}</text>
<line x1="30" y1="947" x2="62" y2="947" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="72" y="951" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">call (waits)</text>
<line x1="181" y1="947" x2="213" y2="947" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="223" y="951" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">reply</text>
<line x1="286" y1="947" x2="318" y2="947" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="328" y="951" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">Kafka event (async)</text>
<line x1="483" y1="947" x2="515" y2="947" stroke="#C62828" stroke-width="1.8" marker-end="url(#mk-red)"/>
<text x="525" y="951" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">failure</text>
<rect x="601" y="938" width="34" height="18" rx="4" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/>
<text x="643" y="951" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">inside the service</text>
