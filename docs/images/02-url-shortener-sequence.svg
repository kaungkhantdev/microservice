<text x="607.5" y="403" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">4. GET abc123</text>
<line x1="705" y1="445" x2="513" y2="445" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
