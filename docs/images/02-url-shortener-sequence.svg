<rect x="660.0" y="80" width="180" height="52" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="750" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">PostgreSQL</text>
<text x="750" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#616161" text-anchor="middle">links schema</text>
