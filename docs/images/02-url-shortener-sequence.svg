<rect x="1080.0" y="80" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="1170" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">analytics-service</text>
<text x="34" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#546E7A" text-anchor="start">A · Create a short link</text>
<line x1="120" y1="223" x2="327" y2="223" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="217" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">1. POST /links {url}</text>
<line x1="330" y1="259" x2="747" y2="259" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">2. save abc123 → url</text>
<line x1="330" y1="295" x2="123" y2="295" stroke="#78909C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mk-grey)"/>
<text x="225.0" y="289" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">201 {shortUrl: /abc123}</text>
<text x="34" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#546E7A" text-anchor="start">B · Click the link (hot path)</text>
<line x1="120" y1="373" x2="327" y2="373" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
