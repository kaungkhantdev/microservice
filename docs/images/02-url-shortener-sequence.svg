<text x="705.0" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">url</text>
<line x1="510" y1="775" x2="702" y2="775" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="607.5" y="769" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212121" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">SET abc123 (TTL 1 h)</text>
<text x="34" y="816" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#546E7A" text-anchor="start">C · See the stats</text>
