<text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121" text-anchor="start">Project 2 · Flow: create, click, count</text>
<text x="30" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">One service answers from cache right away · the click is counted later through Kafka</text>
<polyline points="120,132 120,914" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="30.0" y="80" width="180" height="52" rx="10" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="7 5"/>
<text x="120" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">User</text>
<polyline points="330,132 330,914" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="240.0" y="80" width="180" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="330" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">shortener-service</text>
