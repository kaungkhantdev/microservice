<text x="802.5" y="511" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">6. LinkClicked (async, never waits)</text>
<line x1="1095" y1="553" x2="1287" y2="553" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#mk-orange)"/>
<text x="1192.5" y="547" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#BF5B00" text-anchor="middle" stroke="white" stroke-width="4" paint-order="stroke">7. batch of clicks</text>
