<polyline points="950,450 791,492" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="1150,240 1165,240 1165,590 730,590 730,546" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1210" y="95" width="270" height="420" rx="12" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.4"/>
<text x="1345" y="123" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">What Kubernetes replaced</text>
<text x="1228" y="157" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9E9E9E" text-anchor="start" text-decoration="line-through">Eureka</text>
<text x="1228" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#326CE5" text-anchor="start">→ Service + DNS</text>
<text x="1228" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9E9E9E" text-anchor="start" text-decoration="line-through">Spring Cloud LoadBalancer</text>
<text x="1228" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#326CE5" text-anchor="start">→ Service (kube-proxy)</text>
<text x="1228" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#9E9E9E" text-anchor="start" text-decoration="line-through">Config Server</text>
<text x="1228" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#326CE5" text-anchor="start">→ ConfigMaps + Secrets</text>
<text x="1345" y="321" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">Still needed</text>
<text x="1228" y="351" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2E7D32" text-anchor="start">✓ Resilience4j</text>
<text x="1244" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">app-level timeouts + breakers</text>
<text x="1228" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2E7D32" text-anchor="start">✓ Spring Cloud Gateway</text>
<text x="1244" y="415" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">only if you need Java filters</text>
<text x="1345" y="495" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#212121" text-anchor="middle" font-style="italic">Replaces the plumbing, not the protection.</text>
