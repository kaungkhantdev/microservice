<text x="30" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">Also starts compensation (stretch): OrderCancelRequested by the customer before shipping (FR-8) and the saga timeout (FR-9).</text>
<text x="30" y="595" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">All events are keyed by orderId, so every event of one saga lands on the same partition, in order.</text>
